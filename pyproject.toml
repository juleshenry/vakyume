[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vakyume"
version = "0.2.0"
description = "Verified solvers for every variable of textbook equations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "sympy>=1.13",
    "pebble>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# The original scrape -> shard -> verify -> LLM-repair pipeline (vakyume.py).
legacy = [
    "httpx",
    "ollama",
    "pandas",
    "pymupdf",
    "timeout-decorator",
]

[project.scripts]
vakyume = "vakyume.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["vakyume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: requires a running Ollama LLM instance (deselect with '-m not llm')",
    "slow: long-running test (whole-project verification)",
    "legacy: exercises the old shard/verifier pipeline",
]
addopts = "-m 'not llm and not slow and not legacy'"

[tool.ruff]
line-length = 110
target-version = "py311"
# Legacy pipeline modules are linted only for hard errors (see CI).
extend-exclude = ["projects"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B905"]
